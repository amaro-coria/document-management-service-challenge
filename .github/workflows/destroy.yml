name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to tear down the AWS stack
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Confirm intent
        if: ${{ inputs.confirm != 'destroy' }}
        run: |
          echo "::error::Refusing to run — the confirmation input must be exactly 'destroy'."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=document-management-service/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform destroy
        run: |
          terraform destroy -auto-approve \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="project_prefix=${{ vars.PROJECT_PREFIX }}" \
            -var="ecr_repository_url=${{ vars.ECR_REPOSITORY }}" \
            -var="image_tag=latest"

      - name: Summary
        run: |
          echo "### 💣 Stack destroyed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All main-stack resources have been removed. Bootstrap resources (ECR, state bucket, OIDC role) are untouched." >> "$GITHUB_STEP_SUMMARY"
