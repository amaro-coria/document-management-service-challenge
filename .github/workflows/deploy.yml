name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to spin up the AWS stack
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "::error::Refusing to run — the confirmation input must be exactly 'deploy'."
          exit 1

  build-and-push:
    name: Build & push service image
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: ./mvnw -B -ntp -DskipTests package

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        env:
          ECR_REPO_RAW: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # Strip any stray whitespace a pasted repo variable might carry.
          ECR_REPO="$(echo -n "$ECR_REPO_RAW" | tr -d '[:space:]')"
          echo "Pushing to $ECR_REPO:$TAG"
          docker build -t "$ECR_REPO:$TAG" -t "$ECR_REPO:latest" .
          docker push "$ECR_REPO:$TAG"
          docker push "$ECR_REPO:latest"

  terraform-apply:
    name: terraform apply
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=document-management-service/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform apply
        run: |
          terraform apply -auto-approve \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="project_prefix=${{ vars.PROJECT_PREFIX }}" \
            -var="ecr_repository_url=${{ vars.ECR_REPOSITORY }}" \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}"

      - name: Force ECS service to pick up new task definition
        run: |
          aws ecs update-service \
            --cluster "$(terraform output -raw ecs_cluster)" \
            --service "$(terraform output -raw ecs_service)" \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }} > /dev/null

      - name: Print service URL
        run: |
          URL=$(terraform output -raw service_url)
          echo "### Service deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: $URL/actuator/health" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ECS may take 1–3 minutes to stabilize after this step completes." >> "$GITHUB_STEP_SUMMARY"
