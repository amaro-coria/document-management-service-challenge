spring:
  application:
    name: document-management-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5432}/${DB_NAME:challenge}?currentSchema=${DB_SCHEMA:document_schema}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:document_schema}
        jdbc.time_zone: UTC
    open-in-view: false
  servlet:
    multipart:
      enabled: false

server:
  port: ${APP_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:document-bucket}
    presign-put-ttl-minutes: ${MINIO_PUT_TTL_MIN:15}
    presign-get-ttl-minutes: ${MINIO_GET_TTL_MIN:5}

logging:
  level:
    root: INFO
    com.clara.ops.challenge: DEBUG
